<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plot Twist · Design preview</title><link rel="stylesheet" href="style.css"><body>
<header><a href="#board" class="logo">Plot Twist<span>✳</span></a><nav><a href="#sell">Sell a ticket</a><a class="accent" href="#host">Host a party ↗</a></nav></header>
<main><small class="notice">Design preview · Simulated trades</small>
<section id="board" hidden><h1>The ticket exchange<span>.</span></h1><div class="tools"><input type="search" id="search" aria-label="Search events" placeholder="Search events or venues"><div id="filters" aria-label="Event categories"></div></div><div id="cards"></div></section>
<section id="sell" hidden><a href="#board">← Exchange</a><h1>Sell a ticket<span>.</span></h1><label>Find your event<input id="lookup" placeholder="Paste an event link or type its name"></label><div id="choices"></div></section>
<section id="event" hidden><a href="#board">← Exchange</a><div class="split"><div id="eventPoster"></div><div class="panel"><small id="kind"></small><h1 id="eventName"></h1><p id="where"></p><label>Ticket type<select id="tier"></select></label><div class="prices" id="prices"></div><div id="sides"></div><form id="order"><label id="amountLabel">Your price (£)<input id="amount" type="number" step=".01" min="0" max="10000" required></label><p id="hint"></p><button class="accent" id="submitOrder"></button></form><p role="status" id="result"></p></div></div></section>
<section id="host" hidden><a href="#board">← Exchange</a><h1>Host a house party<span>.</span></h1><div class="split"><form id="editor" class="panel"><label>Party name<input name="name" maxlength="70" required placeholder="Kitchen Disco"></label><label>What’s the plan?<textarea name="plan" maxlength="500" placeholder="Dinner, records and a few friends"></textarea></label><label>Neighbourhood<input name="venue" required placeholder="Marylebone"></label><label>When (London time)<input type="datetime-local" name="when" required></label><div class="two"><label>Tickets<input name="qty" type="number" min="1" max="50" value="10" required></label><label>Price (£)<input name="price" type="number" min="0" max="10000" step=".01" value="0" required></label></div><label>Cover photo (optional)<input id="cover" type="file" accept="image/*"></label><button type="button" class="previewBtn">Preview invite ↓</button><button class="accent">Create preview invite</button></form><div id="invitation"></div></div></section><section id="invite" hidden><a href="#board">← Exchange</a><h1>Your invitation<span>.</span></h1><div id="finished"></div><button id="copy" class="accent">Copy invite link</button><p id="copied" role="status"></p></section></main><script type="module" src="preview.js"></script></body></html>
